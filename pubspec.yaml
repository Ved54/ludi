name: ludi
description: "Ludi is a bidirectional Ludo variant. It plays by classic Ludo rules with one twist: a token can move backward only if doing so captures an opponent token. If the dice roll doesn't produce a valid kill behind the token, that token must move forward instead."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.24.0
  flame_audio: ^2.10.7
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/


  # Nunito (SIL OFL 1.1, see assets/fonts/OFL.txt) — the style guide's
  # typeface (design/visual_style_guide.md section 3).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

